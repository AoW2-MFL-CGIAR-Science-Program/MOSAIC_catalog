description: 'DSSAT soil profile file for Côte d''Ivoire (CI.SOL): 3,823 soil profiles on a 5-arc-minute
  grid covering the whole country, 425 of them inside the N''Zi landscape. It is the unmodified Côte d''Ivoire
  file of the Global High-Resolution Soil Profile Database for Crop Modeling Applications (IRI, MSU and
  HarvestChoice/IFPRI, 2015), published on the IFPRI Dataverse.'
