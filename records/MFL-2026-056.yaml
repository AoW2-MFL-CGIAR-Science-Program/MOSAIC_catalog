id: MFL-2026-056
title: "Crop fields (2023)  focus on \tPotatoes, Oca, Mashua and andean fruit trees"
description: 'A total of 206 farmers in Cumbal, Colombia, were surveyed utilizing ArcGIS Survey 123. Each
  farmer''s field was physically visited, and the ''Participatory Mapping of Farmers'' Fields'' tool was
  employed to delineate polygons for each ''shagra'', accurately determining their respective areas. This
  process captured the characteristics of 557 mapped plots across 206 farmers'' households. The resultant
  comprehensive dataset comprises five distinct databases: A) Preliminary Information, B) Shagra Information,
  C) Land Use Over the Years, and D) Variety Names. These datasets have been individualized and standardized
  using the common identifiers ''GlobalID Household'' and ''GlobalID Shagra''.'
